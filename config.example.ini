# SolarCharge settings
# Copy this file to config.ini and edit that copy:  cp config.example.ini config.ini
# After editing, restart with:  sudo systemctl restart solarcharge

[inverter]
# Sungrow inverter's IP address on your network (the WiNet S dongle). Modbus TCP must be reachable on port 502.
host =
port = 502
unit = 1
# Registers for Sungrow residential string inverters with a Sungrow smart meter
# (tested on an SG10RS). Check them against the iSolarCloud app with --check.
#   5030 total active power (AC output, matches the app's PV figure)
#   5090 load power (whole house, including the car)
#   5600 meter power (positive = importing, negative = exporting)
pv_register = 5030
load_register = 5090
grid_register = 5600

[charger]
# Tesla Wall Connector Gen 3 IP address. Leave blank to run without it (no plug in detection).
host =

[tesla]
# Your car's VIN (shown in the Tesla app under the car's software or details screen)
vin =
# File holding your Teslemetry access token, readable only by you (chmod 600).
# Optional when Bluetooth is enabled, but recommended as a backup.
token_file = ~/.solarcharge_token
api_base = https://api.teslemetry.com
# How often to ask the car for battery level while plugged in. Each request uses
# Teslemetry credits, so 0 turns it off. 15 is a sensible value if you want it.
vehicle_poll_minutes = 0
# Live battery level, charge limit and time to full come from Teslemetry's free data stream.
# If TeslaTrack (https://github.com/brad-24/teslatrack) runs on this Pi, take them from it instead,
# so only one app holds the stream:  teslatrack_url = http://localhost:8084
stream = true
teslatrack_url =
# Usable battery size in kWh, only used to estimate time to the charge limit when the car
# hasn't reported it yet. About 60 for a Model Y RWD, about 75 for a Long Range.
battery_kwh = 60

[ble]
# Control charging over Bluetooth instead of Teslemetry (free). Turn on after pairing.
enabled = false
tool = ~/solarcharge/bin/tesla-control
key_file = ~/.solarcharge_ble_key.pem
adapter = hci0
# If a Bluetooth command fails, use Teslemetry for starts, stops and amp cuts
fallback_teslemetry = true
# Read the battery level over Bluetooth this often while charging (minutes)
read_battery_minutes = 3
# Commands are free over Bluetooth, so follow the sun more closely
fast_tracking = true
# While Bluetooth is unavailable (phones and watches using the car's Bluetooth slots), amp changes go
# through Teslemetry at the slower pace in [control] and cost a credit each. This caps how many amp
# increases a day may do that. Starts, stops and decreases are never held back.
teslemetry_raises_per_day = 10

[schedule]
# LFP batteries: reach 100% about once a week
full_charge_every_days = 7
# Days the car is usually home all day, for suggesting the full charge day
# (learned automatically by TeslaTrack, if it runs on this Pi, once there are a few weeks of data) (remove the days it is usually out)
home_all_day = mon,tue,wed,thu,fri,sat,sun
# Solar forecast from Open-Meteo (free, no account). Set your approximate location
# (two decimal places is plenty) and solar system size in kW, then set forecast = true.
forecast = false
latitude = 0
longitude = 0
pv_kwp = 6.6

[fleet]
# Tesla's own Fleet API, a free backup for when Bluetooth can't get through (phone keys can
# fill the car's Bluetooth slots). Used before Teslemetry. Tesla bills about US$0.001 a command
# and gives every account US$10 a month, so normal use costs nothing. One time setup: FLEET.md
enabled = false
client_id =
client_secret =
# where your public key is published, for example yourname.github.io
domain =
# defaults to https://<domain>/callback
redirect_uri =
# North America and Asia Pacific (including Australia). Europe: https://fleet-api.prd.eu.vn.cloud.tesla.com
api_base = https://fleet-api.prd.na.vn.cloud.tesla.com
key_file = ~/.solarcharge_fleet_key.pem
token_file = ~/.solarcharge_fleet.json

[control]
# true = work everything out and log it, but send nothing to the car
dry_run = true
# Mode used the very first time. After that, the dashboard choice is remembered.
# manual, solar, minsolar or fast
default_mode = solar
poll_seconds = 10

# Charging current limits. Set max_amps to your Wall Connector's commissioned limit
# (or lower). Single phase, so 32 is the most a Gen 3 can deliver.
min_amps = 5
max_amps = 16
nominal_volts = 230

# Start charging when the 1 minute average surplus is at least
# (min_amps x volts + start_margin_w) and has stayed there for start_delay_s.
start_margin_w = 200
start_delay_s = 180

# While charging, allow up to this much grid import before reducing amps or stopping.
# 0 = strictly solar only. Higher = fewer stops on cloudy days.
grid_allowance_w = 300

# Stop when even min_amps cannot be covered for this long
stop_delay_s = 60

# Once started, run at least this long. Once stopped, stay off at least this long.
min_run_s = 0
min_off_s = 300

# Smoothing window for the surplus average
smooth_seconds = 90

# Amp changes (each one costs a Teslemetry credit). Amps go up by at most amp_up_step,
# no more often than every amp_up_interval_s and at most max_amp_raises_per_hour times,
# and only when the new rate is covered by solar with amp_up_headroom_w to spare and is at
# least amp_min_change higher. They come down when import passes grid_allowance_w, no more
# often than every amp_down_interval_s, or after 20 s if importing more than
# grid_allowance_w + emergency_import_w.
amp_up_interval_s = 180
amp_up_step = 4
amp_up_headroom_w = 250
amp_min_change = 2
emergency_import_w = 1000
max_amp_raises_per_hour = 6
amp_down_interval_s = 90

# Stop charging if the inverter cannot be read for this long (solar modes only)
read_fail_stop_s = 60

# If the car is told to charge but draws nothing for this long (full, at its limit,
# or stopped from the app), back off for no_charge_backoff_s
no_charge_grace_s = 180
no_charge_backoff_s = 1800

# Wait this long before retrying after a failed command
command_retry_s = 120

[storage]
# Routine readings go to RAM (no SD card wear, cleared on reboot)
ram_dir = /dev/shm/solarcharge
# Events log and saved history go to the SD card
data_dir = ~/solarcharge/data
readings_max_mb = 5
events_max_kb = 512
# Save chart history and daily totals to the SD card this often
save_minutes = 30
history_days = 3

[tariff]
# Used for the cost and savings figures on the Sessions page (cents per kWh, incl. GST).
# Your grid import price, and the solar feed in credit you give up when the car uses solar.
import_c_per_kwh = 30
feed_in_c_per_kwh = 5
# For the running bill on the Meter tab: the daily supply charge (cents per day, incl. GST)
# and the day of the month your billing period starts
supply_c_per_day = 0
bill_day = 1
# For the Sessions page: what the same distance would cost in a fuel car (needs TeslaTrack for the
# distance). Fuel use in litres per 100 km, the fuel price in cents per litre, and its name
fuel_l_per_100km = 8
fuel_c_per_l = 200
fuel_name = petrol

[web]
bind = 0.0.0.0
port = 8080
